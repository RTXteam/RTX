        nodes for all pairs of nodes with corresponding keys. It will then add edges
        to the knowledge graph along with edge attributes (with the property name
        jaccard_index) between each start_node_key and object_node_key. A query graph
        edge will also be added using the key specified by virtual_relation_label.
        This is used for purposes such as "find me all drugs (start_node_key) that
        have many proteins (intermediate_node_key) in common with this disease (end_node_key)."
        This can be used for downstream filtering to concentrate on relevant bioentities.
      properties:
        id:
          enum:
          - overlay_compute_jaccard
          type: string
        parameters:
          $ref: '#/components/schemas/OperationOverlayComputeJaccard_parameters'
        runner_parameters:
          oneOf:
          - properties:
              allowlist:
                description: List of operation providers (by infores ID) that may
                  be used to complete operation. No others will be used. A full list
                  of operation providers for each operation with infores ID's is available
                  through the '/services' endpoint of the workflow runner.
                examples:
                  - infores:aragorn
                items:
                  type: string
                minItems: 1
                type: array
          - properties:
              denylist:
                description: List of operation providers (by infores ID) that may
                  not be used to complete operation. All others will be used. A full
                  list of operation providers for each operation with infores ID's
                  is available through the '/services' endpoint of the worflow runner.
                examples:
