name: "Test Build"

on:
  workflow_dispatch:
    
  push:
    branches: [ master, production, itrb-test, dev ]
    paths:
      - 'code/**'
      - 'DockerBuild/**'
      - 'requirements.txt'
      - '.github/workflows/pytest.yml'
  pull_request:
    branches: [ master, production, itrb-test, dev ]
    paths:
      - 'code/**'
      - 'DockerBuild/**'
      - 'requirements.txt'
      - '.github/workflows/pytest.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }} # this is the workflow name and the branch name
  cancel-in-progress: true # this is to cancel the in-progress workflow if a new one is started

jobs:
  analyze:
    name: Analyze
    runs-on: [self-hosted, ARAX, docker]
    env:
      PYTHONPATH: ${{ github.workspace }}/code
    permissions:
      actions: read
      contents: read
      security-events: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]

    steps:
    - name: Checkout code to RTX directory
      uses: actions/checkout@v2
      with:
        #path: /home/ubuntu/RTX
        ref: ${{ github.head_ref || github.ref_name }}

    - name: Set up Python environment
      uses: RTXteam/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Set up config files
      run: |
        scp araxconfig@araxconfig.rtx.ai:config_secrets.json /mnt/config/config_secrets.json
    
    - name: Download databases into CICD instance
      working-directory: ${{ github.workspace }}
      # continue-on-error: true
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python code/ARAX/ARAXQuery/ARAX_database_manager.py --mnt --skip-if-exists --remove_unused

    # Scoped to this workflow's own container/image only. Other containers on the
    # host (such as per-PR preview containers rtx_pr_<N>, see deploy/preview/README.md)
    # must survive a CI run. Issue #2846.
    - name: Clean up previous rtx_test container and image
      continue-on-error: true
      run: |
        sudo docker rm -f rtx_test 2>/dev/null || echo "No previous rtx_test container"
        sudo docker rmi -f rtx:test 2>/dev/null || echo "No previous rtx:test image"

    - name: Build docker image 
      run: sudo docker build --no-cache=true --rm --build-arg "BUILD_BRANCH=${{ github.head_ref || github.ref_name }}" -t rtx:test DockerBuild/ -f DockerBuild/CICD-Dockerfile
    - name: Run docker container
      run: sudo docker run -d -it --name rtx_test -v /mnt/data/orangeboard/databases:/mnt/data/orangeboard/databases -v /mnt/config/config_secrets.json:/mnt/data/orangeboard/production/RTX/code/config_secrets.json rtx:test

    - name: Create symlinks
      run: sudo docker exec rtx_test bash -c "sudo -u rt bash -c 'cd /mnt/data/orangeboard/production/RTX && python3 code/ARAX/ARAXQuery/ARAX_database_manager.py'"

    - name: Build KP info cache
      run: sudo docker exec rtx_test bash -c "cd /mnt/data/orangeboard/production/RTX/code/ARAX/ARAXQuery/Expand && python3 kp_info_cacher.py"
    
    - name: Start services
      run: |
        sudo docker exec rtx_test service apache2 start
        sudo docker exec rtx_test service RTX_OpenAPI_production start
        sudo docker exec rtx_test service RTX_Complete start
    
    - name: Run tests with pytest
      run: sudo docker exec rtx_test bash -c "cd /mnt/data/orangeboard/production/RTX/code/ARAX/test && pytest -v --disable-pytest-warnings"
    
    - name: Remove rtx_test container and image
      if: always()
      continue-on-error: true
      run: |
        sudo docker rm -f rtx_test 2>/dev/null || echo "No rtx_test container"
        sudo docker rmi -f rtx:test 2>/dev/null || echo "No rtx:test image"
        # dangling layers only, never touches tagged images of other containers
        sudo docker image prune -f
